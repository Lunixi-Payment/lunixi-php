# Exact reviewed generated-key assertion and synthetic test-vector matches only.
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed synthetic test material or PEM marker assertion"
condition = "AND"
targetRules = ["private-key"]
paths = ['''(?:^|/)tests/Auth/Ed25519SignerTest\.php$''']
regexTarget = "match"
regexes = ['''\A\Q-----BEGIN PRIVATE KEY-----', $keys['privateKey']);
        $this->assertStringContainsString('-----BEGIN PUBLIC KEY-----\E\z'''] # gitleaks:allow

[[allowlists]]
description = "Reviewed synthetic test material or PEM marker assertion"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/Webhook/fixtures/webhook\-v2\-vectors\.json$''']
regexTarget = "match"
regexes = ['''\A\Qsecret":"whsec_testsecret_0123456789abcdef"\E\z'''] # gitleaks:allow

[[allowlists]]
description = "Reviewed synthetic test material or PEM marker assertion"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/Webhook/fixtures/webhook\-v2\-vectors\.json$''']
regexTarget = "match"
regexes = ['''\A\Qsecret":"whsec_testsecret_0123456789abcdef"\E\z'''] # gitleaks:allow

[[allowlists]]
description = "Reviewed synthetic test material or PEM marker assertion"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/Webhook/fixtures/webhook\-v2\-vectors\.json$''']
regexTarget = "match"
regexes = ['''\A\Qsecret":"whsec_previous_fedcba9876543210aa"\E\z'''] # gitleaks:allow

[[allowlists]]
description = "Reviewed synthetic test material or PEM marker assertion"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/Insurance/InsuranceClientTest\.php$''']
regexTarget = "match"
regexes = ['''\A\QKEY = 'insurance-test-key-0001'\E\z'''] # gitleaks:allow

[[allowlists]]
description = "Synthetic idempotency key used only by the offline Physical POS parity test"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/PhysicalPos/PhysicalPosParityTest\.php$''']
regexTarget = "line"
regexes = ['''\A\s*\Qprivate const KEY = 'pos-parity-key-0001';\E\s*\z'''] # gitleaks:allow

[[allowlists]]
description = "Synthetic UUID in the shared Physical POS idempotency-key validation cases"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/PhysicalPos/fixtures/physical-pos-parity\.json$''']
regexTarget = "line"
regexes = ['''\A\s*\Q"key": "7b0c6a1e-2f8d-4c55-9a51-3f0e8d1c2a90",\E\s*\z'''] # gitleaks:allow
