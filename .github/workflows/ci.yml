name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json
          coverage: none
      - name: Lint src
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: lunixi_test
          MARIADB_USER: lunixi_test
          MARIADB_PASSWORD: fixture-only
          MARIADB_ROOT_PASSWORD: fixture-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json, bcmath, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --no-progress --prefer-dist
      - name: Configure disposable database
        run: |
          php -r 'file_put_contents("/tmp/lunixi-php-test-db.json", json_encode(["database"=>"lunixi_test","host"=>"127.0.0.1","port"=>3306,"username"=>"lunixi_test","password"=>"fixture-only"])); chmod("/tmp/lunixi-php-test-db.json",0600);'
      - run: vendor/bin/phpunit
        env:
          LUNIXI_TEST_DB_FILE: /tmp/lunixi-php-test-db.json
      - run: vendor/bin/phpstan analyse src/Commerce --level=8 --no-progress
      - run: composer audit

  frameworks:
    name: Native ${{ matrix.framework }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ['codeigniter', 'yii']
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: samples/${{ matrix.framework }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json, bcmath, intl, mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: php vendor/bin/phpunit -c phpunit.xml
      - run: python3 tests/http-smoke.py
      - run: php vendor/bin/phpstan analyse --no-progress
      - run: php vendor/bin/phpcs
      - run: composer audit
